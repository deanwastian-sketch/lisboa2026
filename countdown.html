iv class="titleblock"><div class="flag">🇵🇹</div><div class="eyebrow">City Break</div><h1>LISBONA</h1><div class="year">2026</div><div class="rule"></div><div class="date">16.–19. november 2026</div></div><div class="panel"><div class="ct">Do odhoda še</div><div class="count"><div><div class="num" id="d">00</div><div class="lab">DNI</div></div><div><div class="num" id="h">00</div><div class="lab">UR</div></div><div><div class="num" id="m">00</div><div class="lab">MIN</div></div><div><div class="num" id="s">00</div><div class="lab">SEK</div></div></div><div class="meta">7 potnikov · 4 dni · Portugalska</div><div class="teaser">Naslednja posodobitev · 14. november<br><b>Ne pozabi preveriti!</b><br><span id="nextUpdate" style="display:inline-block;margin-top:5px;color:#e6efec">Nova vsebina čez ...</span></div></div></section></main><script>const t=new Date('2026-11-16T07:50:00+01:00').getTime(),p=n=>String(n).padStart(2,'0');function x(){let q=Math.floor(Math.max(0,t-Date.now())/1000);d.textContent=p(Math.floor(q/86400));h.textContent=p(Math.floor(q%86400/3600));m.textContent=p(Math.floor(q%3600/60));s.textContent=p(q%60)}function updateRefresh(){const next=new Date('2026-11-14T00:00:00+01:00').getTime();let q=Math.floor(Math.max(0,next-Date.now())/1000);const dd=Math.floor(q/86400),hh=Math.floor((q%86400)/3600),mm=Math.floor((q%3600)/60);document.getElementById('nextUpdate').textContent=q>0?'Nova vsebina čez '+dd+' dni, '+hh+' ur in '+mm+' min':'Nova vsebina je pripravljena, ponovno skeniraj QR.'}x();updateRefresh();setInterval(x,1000);setInterval(updateRefresh,30000)</script></body></html>
