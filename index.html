<!doctype html>
<html lang="sl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102f2b"><title>Lisboa 2026 · City Break</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#102f2b;color:#fff}body{min-height:100svh}.hero{position:relative;min-height:100svh;display:flex;justify-content:center;background:url('lisboa.jpg') center 58%/cover no-repeat}.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,24,25,.43),rgba(5,24,25,.16) 35%,rgba(5,24,25,.28) 62%,rgba(5,24,25,.78))}.content{position:relative;z-index:1;width:min(100%,560px);min-height:100svh;padding:max(24px,env(safe-area-inset-top)) 20px max(22px,env(safe-area-inset-bottom));display:flex;flex-direction:column;justify-content:center;text-align:center;gap:0}.titleblock{transform:translateY(-4vh)}.flag{font-size:28px;line-height:1;filter:drop-shadow(0 2px 7px rgba(0,0,0,.45))}.eyebrow{margin-top:9px;font-size:11px;font-weight:800;letter-spacing:.36em;text-transform:uppercase;color:#f4cf67;text-shadow:0 2px 10px rgba(0,0,0,.55)}h1{margin:9px 0 0;font-size:clamp(54px,17vw,86px);line-height:.88;letter-spacing:-.06em;font-weight:900;text-shadow:0 4px 22px rgba(0,0,0,.43)}.year{margin-top:10px;font-size:18px;font-weight:800;letter-spacing:.68em;padding-left:.68em}.rule{width:60px;height:2px;background:#e0b43d;margin:18px auto 14px}.date{font-size:13px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;text-shadow:0 2px 10px rgba(0,0,0,.65)}.countpanel{margin-top:clamp(58px,10vh,105px);width:100%;border:1px solid rgba(255,255,255,.32);background:rgba(8,37,35,.57);backdrop-filter:blur(13px) saturate(115%);-webkit-backdrop-filter:blur(13px) saturate(115%);border-radius:28px;padding:21px 14px 18px;box-shadow:0 18px 50px rgba(0,0,0,.30),inset 0 1px 0 rgba(255,255,255,.08)}.counttitle{font-size:10px;font-weight:900;letter-spacing:.3em;color:#f4cf67;text-transform:uppercase;margin-bottom:15px}.countdown{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.num{font-variant-numeric:tabular-nums;font-size:clamp(27px,8.5vw,40px);font-weight:900;line-height:1}.lab{margin-top:7px;font-size:8px;font-weight:800;letter-spacing:.16em;color:#d2dfdc}.meta{margin-top:17px;font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:#eef4f2}.teaser{margin-top:11px;font-size:9px;line-height:1.5;letter-spacing:.12em;text-transform:uppercase;color:#c3d1cd}.reminder{color:#f4cf67;font-weight:800}@media(min-width:700px){.content{width:min(100%,620px)}.titleblock{transform:translateY(-2vh)}.countpanel{margin-top:clamp(70px,12vh,125px)}}@media(max-height:700px){.content{justify-content:flex-start}.titleblock{transform:none}.countpanel{margin-top:44px}}@media(max-width:360px){.content{padding-left:14px;padding-right:14px}.countpanel{padding-left:9px;padding-right:9px}.meta{font-size:9px}.teaser{font-size:8px}}
</style>
</head>
<body><main class="hero"><div class="shade"></div><section class="content"><div class="titleblock"><div class="flag">🇵🇹</div><div class="eyebrow">City Break</div><h1>LISBONA</h1><div class="year">2026</div><div class="rule"></div><div class="date">16.–19. november 2026</div></div><div class="countpanel"><div class="counttitle">Do odhoda še</div><div class="countdown"><div><div class="num" id="days">00</div><div class="lab">DNI</div></div><div><div class="num" id="hours">00</div><div class="lab">UR</div></div><div><div class="num" id="minutes">00</div><div class="lab">MIN</div></div><div><div class="num" id="seconds">00</div><div class="lab">SEK</div></div></div><div class="meta">7 potnikov · 4 dni · Portugalska</div><div class="teaser">Naslednja posodobitev · 14. november<br><span class="reminder">Ne pozabi preveriti!</span></div></div></section></main>
<script>(()=>{const departure=new Date('2026-11-16T00:00:00+01:00').getTime(),e=id=>document.getElementById(id),pad=n=>String(n).padStart(2,'0');function tick(){const s=Math.floor(Math.max(0,departure-Date.now())/1000);e('days').textContent=pad(Math.floor(s/86400));e('hours').textContent=pad(Math.floor((s%86400)/3600));e('minutes').textContent=pad(Math.floor((s%3600)/60));e('seconds').textContent=pad(s%60)}tick();setInterval(tick,1000)})();</script></body></html>
