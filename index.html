<!doctype html>
<html lang="sl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#102f2b">
  <title>Lisboa 2026 · City Break</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#102f2b;color:#fff}body{min-height:100svh}.hero{position:relative;min-height:100svh;display:flex;align-items:stretch;justify-content:center;background:url('lisboa.jpg') center 62%/cover no-repeat}.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,24,25,.48) 0%,rgba(5,24,25,.2) 31%,rgba(5,24,25,.22) 52%,rgba(5,24,25,.78) 82%,rgba(5,24,25,.94) 100%)}.content{position:relative;z-index:1;width:min(100%,520px);min-height:100svh;padding:max(30px,env(safe-area-inset-top)) 22px max(24px,env(safe-area-inset-bottom));display:flex;flex-direction:column;text-align:center}.flag{font-size:24px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.35))}.eyebrow{margin-top:8px;font-size:11px;font-weight:700;letter-spacing:.34em;text-transform:uppercase;color:#f4cf67;text-shadow:0 2px 10px rgba(0,0,0,.5)}h1{margin:9px 0 0;font-size:clamp(47px,15vw,76px);line-height:.92;letter-spacing:-.055em;font-weight:900;text-shadow:0 3px 18px rgba(0,0,0,.36)}.year{margin-top:8px;font-size:17px;font-weight:700;letter-spacing:.62em;padding-left:.62em;color:#fff}.rule{width:54px;height:2px;background:#e0b43d;margin:18px auto 14px}.date{font-size:13px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;text-shadow:0 2px 10px rgba(0,0,0,.55)}.spacer{flex:1;min-height:180px}.countpanel{border:1px solid rgba(255,255,255,.22);background:rgba(8,37,35,.68);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:24px;padding:19px 12px 17px;box-shadow:0 14px 35px rgba(0,0,0,.24)}.counttitle{font-size:10px;font-weight:800;letter-spacing:.28em;color:#f4cf67;text-transform:uppercase;margin-bottom:14px}.countdown{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.num{font-variant-numeric:tabular-nums;font-size:clamp(25px,8vw,37px);font-weight:800;line-height:1}.lab{margin-top:7px;font-size:8px;font-weight:700;letter-spacing:.15em;color:#c8d7d3}.meta{margin-top:16px;font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#e7eeec}.teaser{margin-top:13px;font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:#b5c7c2}.ended{font-size:22px;font-weight:800;grid-column:1/-1;color:#f4cf67}@media(max-width:360px){.content{padding-left:15px;padding-right:15px}.spacer{min-height:130px}.meta{font-size:9px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
  </style>
</head>
<body>
  <main class="hero">
    <div class="shade"></div>
    <section class="content">
      <div class="flag">🇵🇹</div>
      <div class="eyebrow">City Break</div>
      <h1>LISBONA</h1>
      <div class="year">2026</div>
      <div class="rule"></div>
      <div class="date">16.–19. november 2026</div>
      <div class="spacer"></div>
      <div class="countpanel">
        <div class="counttitle">Do odhoda še</div>
        <div class="countdown" id="countdown">
          <div><div class="num" id="days">00</div><div class="lab">DNI</div></div>
          <div><div class="num" id="hours">00</div><div class="lab">UR</div></div>
          <div><div class="num" id="minutes">00</div><div class="lab">MIN</div></div>
          <div><div class="num" id="seconds">00</div><div class="lab">SEK</div></div>
        </div>
        <div class="meta">7 potnikov · 4 dni · Portugalska</div>
        <div class="teaser">Naslednja posodobitev · 14. november</div>
      </div>
    </section>
  </main>
<script>
(() => {
  // V1: odhod je začasno nastavljen na 16. 11. 2026 ob 00:00 po slovenskem času.
  const departure = new Date('2026-11-16T00:00:00+01:00').getTime();
  const e = id => document.getElementById(id);
  const pad = n => String(n).padStart(2,'0');
  function tick(){
    let diff = Math.max(0, departure - Date.now());
    const s = Math.floor(diff/1000);
    e('days').textContent = pad(Math.floor(s/86400));
    e('hours').textContent = pad(Math.floor((s%86400)/3600));
    e('minutes').textContent = pad(Math.floor((s%3600)/60));
    e('seconds').textContent = pad(s%60);
  }
  tick(); setInterval(tick,1000);
})();
</script>
</body>
</html>
