<!doctype html><html lang="sl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Lisboa 2026 · Pripravi se</title><style>*{box-sizing:border-box}body{margin:0;min-height:100svh;font-family:Arial,sans-serif;color:#fff;background:linear-gradient(#06211fc7,#06211fe8),url('lisboa.jpg') center/cover fixed}.wrap{width:min(100%,560px);margin:auto;padding:28px 18px 35px;text-align:center}.flag{font-size:27px}.small{color:#f4cf67;font-weight:900;letter-spacing:.28em;font-size:10px;text-transform:uppercase}h1{font-size:43px;margin:8px 0 3px}.date{font-size:12px;letter-spacing:.14em;text-transform:uppercase}.box{margin-top:26px;padding:20px 16px;background:#082523b3;border:1px solid #ffffff45;border-radius:25px;backdrop-filter:blur(10px)}h2{margin:0;font-size:27px}.count{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:17px 0}.num{font-size:29px;font-weight:900}.lab{font-size:8px;letter-spacing:.14em;color:#cddbd7}.pack{margin:20px 0 10px;color:#f4cf67;font-weight:900;letter-spacing:.14em;text-transform:uppercase;font-size:11px}.list{display:grid;grid-template-columns:1fr 1fr;gap:9px 12px;text-align:left}.item{display:flex;gap:8px;font-size:13px;align-items:flex-start}.item input{width:17px;height:17px;accent-color:#e0b43d}.dep{margin-top:20px;padding-top:16px;border-top:1px solid #ffffff2d;line-height:1.6;font-size:13px}.dep b{color:#f4cf67}.end{font-size:11px;color:#cedbd8;margin-top:15px}@media(max-width:390px){.list{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="flag">🇵🇹</div><div class="small">Lisboa 2026</div><h1>ŠE MALO!</h1><div class="date">Pripravi se na odhod</div><section class="box"><div class="small">Do odhoda še</div><div class="count"><div><div class="num" id="d">00</div><div class="lab">DNI</div></div><div><div class="num" id="h">00</div><div class="lab">UR</div></div><div><div class="num" id="m">00</div><div class="lab">MIN</div></div><div><div class="num" id="s">00</div><div class="lab">SEK</div></div></div><div class="pack">Ne pozabi spakirati</div><div class="list" id="list"></div><div class="dep"><b>PONEDELJEK · 16. NOVEMBER</b><br>Odhod ob <b>7:50</b> iz <b>Vitanja</b></div><div class="end">Naslednjič, ko preveriš to stran, bomo že na poti. 🇵🇹</div></section></main><script>const items=['Potni list','Zdravstvena kartica','Turistično zavarovanje','Bančna kartica','Dežnik','Polnilec za telefon + kabel','Sendvič','Pijača','Prisrčnica','Osebna higiena','Dobra volja','Vedoželjnost'];items.forEach((v,i)=>{let l=document.createElement('label'),c=document.createElement('input'),z=document.createElement('span');l.className='item';c.type='checkbox';c.checked=localStorage.getItem('lisboa-pack-'+i)==='1';c.onchange=()=>localStorage.setItem('lisboa-pack-'+i,c.checked?'1':'0');z.textContent=v;l.append(c,z);list.append(l)});const t=new Date('2026-11-16T07:50:00+01:00').getTime(),p=n=>String(n).padStart(2,'0');function x(){let q=Math.floor(Math.max(0,t-Date.now())/1000);d.textContent=p(Math.floor(q/86400));h.textContent=p(Math.floor(q%86400/3600));m.textContent=p(Math.floor(q%3600/60));s.textContent=p(q%60)}x();setInterval(x,1000)</script></body></html>
