<!doctype html><html lang="sl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Lisboa 2026 · Pripravi se</title><style>*{box-sizing:border-box}body{margin:0;min-height:100svh;font-family:Arial,sans-serif;color:#fff;background:linear-gradient(#06211fc7,#06211fe8),url('lisboa.jpg') center/cover fixed}.wrap{width:min(100%,560px);margin:auto;padding:28px 18px 35px;text-align:center}.flag{font-size:27px}.small{color:#f4cf67;font-weight:900;letter-spacing:.28em;font-size:10px;text-transform:uppercase}h1{font-size:43px;margin:8px 0 3px}.date{font-size:12px;letter-spacing:.14em;text-transform:uppercase}.box{margin-top:26px;padding:20px 16px;background:#082523b3;border:1px solid #ffffff45;border-radius:25px;backdrop-filter:blur(10px)}h2{margin:0;font-size:27px}.count{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:17px 0}.num{font-size:29px;font-weight:900}.lab{font-size:8px;letter-spacing:.14em;color:#cddbd7}.pack{margin:20px 0 10px;color:#f4cf67;font-weight:900;letter-spacing:.14em;text-transform:uppercase;font-size:11px}.list{display:grid;grid-template-columns:1fr 1fr;gap:9px 12px;text-align:left}.item{display:flex;gap:8px;font-size:13px;align-items:flex-start}.item input{width:17px;height:17px;accent-color:#e0b43d}.dep{margin-top:20px;padding-top:16px;border-top:1px solid #ffffff2d;line-height:1.6;font-size:13px}.dep b{color:#f4cf67}.end{font-size:11px;color:#cedbd8;margin-top:15px}.ready{display:none;margin-top:18px;padding:15px 12px;border:1px solid #f4cf6780;background:#f4cf6717;border-radius:18px;text-align:center}.ready.show{display:block}.ready strong{display:block;color:#f4cf67;font-size:18px;margin-bottom:5px}.ready span{font-size:12px;color:#eef5f2}@media(max-width:390px){.list{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="flag">🇵🇹</div><div class="small">Lisboa 2026</div><h1>ŠE MALO!</h1><div class="date">Pripravi se na odhod</div><section class="box"><div class="small">Do odhoda še</div><div class="count"><div><div class="num" id="d">00</div><div class="lab">DNI</div></div><div><div class="num" id="h">00</div><div class="lab">UR</div></div><div><div class="num" id="m">00</div><div class="lab">MIN</div></div><div><div class="num" id="s">00</div><div class="lab">SEK</div></div></div><div class="pack">Ne pozabi spakirati</div><div class="list" id="list"></div><div class="dep"><b>PONEDELJEK · 16. NOVEMBER</b><br>Odhod ob <b>7:50</b> iz <b>Vitanja</b></div><div class="ready" id="ready"><strong>✓ 1 POTNIK JE PRIPRAVLJEN!</strong><span>Le kako je z ostalimi? 😏</span></div><div class="end">Naslednjič, ko preveriš to stran, bomo že na poti. 🇵🇹<br><span id="nextPhase" style="display:inline-block;margin-top:7px;color:#f4cf67;font-weight:800">Dnevni program se odpre čez ...</span></div></section></main><script>
(() => {
  const items = ['Potni list','Zdravstvena kartica','Turistično zavarovanje','Bančna kartica','Dežnik','Polnilec za telefon + kabel','Sendvič','Pijača','Prisrčnica','Osebna higiena','Dobra volja','Vedoželjnost'];
  const listEl = document.getElementById('list');
  const readyEl = document.getElementById('ready');
  const ids = {d:document.getElementById('d'),h:document.getElementById('h'),m:document.getElementById('m'),s:document.getElementById('s')};

  function checkReady() {
    const boxes = Array.from(document.querySelectorAll('.item input[type="checkbox"]'));
    readyEl.classList.toggle('show', boxes.length === items.length && boxes.every(cb => cb.checked));
  }

  items.forEach((text, i) => {
    const label = document.createElement('label');
    label.className = 'item';
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = localStorage.getItem('lisboa-pack-' + i) === '1';
    cb.addEventListener('change', () => {
      localStorage.setItem('lisboa-pack-' + i, cb.checked ? '1' : '0');
      checkReady();
    });
    const span = document.createElement('span');
    span.textContent = text;
    label.append(cb, span);
    listEl.append(label);
  });
  checkReady();

  const departure = new Date('2026-11-16T07:50:00+01:00').getTime();
  const pad = n => String(n).padStart(2,'0');
  function tick(){
    const q = Math.floor(Math.max(0, departure - Date.now()) / 1000);
    ids.d.textContent = pad(Math.floor(q/86400));
    ids.h.textContent = pad(Math.floor((q%86400)/3600));
    ids.m.textContent = pad(Math.floor((q%3600)/60));
    ids.s.textContent = pad(q%60);
  }
  function updatePhase(){const next=new Date('2026-11-16T00:00:00+01:00').getTime();let q=Math.floor(Math.max(0,next-Date.now())/1000);const dd=Math.floor(q/86400),hh=Math.floor((q%86400)/3600),mm=Math.floor((q%3600)/60);document.getElementById('nextPhase').textContent=q>0?'Dnevni program se odpre čez '+dd+' dni, '+hh+' ur in '+mm+' min':'Program 1. dne je pripravljen, ponovno skeniraj QR.'}tick();updatePhase();setInterval(tick,1000);setInterval(updatePhase,30000);
})();
</script></body></html>
